spring:
  application:
    name: credchain-backend

  # Load secrets from infra/.env (works whether started from project root or backend folder)
  config:
    import:
      - "optional:file:./infra/.env[.properties]"
      - "optional:file:../infra/.env[.properties]"

  # Which profile is active (dev = local machine, prod = server later)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------- Database ----------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credchain}
    username: ${DB_USERNAME:credchain}
    password: ${DB_PASSWORD:changeme}
    hikari:
      pool-name: credchain-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  # ---------- JPA / Hibernate ----------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ---------- Monitoring ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ---------- CredChain application settings ----------
app:
  security:
    jwt:
      issuer: credchain-api
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}