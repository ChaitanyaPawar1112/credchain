spring:
  application:
    name: credchain-backend

  # Load secrets from infra/.env (works whether started from project root or backend folder)
  config:
    import:
      - "optional:file:./infra/.env[.properties]"
      - "optional:file:../infra/.env[.properties]"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------- Database ----------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credchain}
    username: ${DB_USERNAME:credchain}
    password: ${DB_PASSWORD:changeme}
    hikari:
      pool-name: credchain-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  # ---------- JPA / Hibernate ----------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50          # group INSERTs into batches of 50 (bulk import)
        order_inserts: true
        format_sql: true

  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ---------- File uploads ----------
  servlet:
    multipart:
      max-file-size: 5MB          # photos of certificates (Phase 7); the PDF check keeps its own 2 MB limit
      max-request-size: 5MB

  # ---------- Email (Phase 8.2) ----------
  # Locally every email is caught by Mailpit (docker compose): read them at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}                       # secret for a real SMTP server; empty for Mailpit
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ---------- Monitoring ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false              # a mail server being down must not mark the backend unhealthy

# ---------- CredChain application settings ----------
app:
  security:
    jwt:
      issuer: credchain-api
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
      full-name: ${SUPER_ADMIN_FULL_NAME:System Administrator}

  # ---------- Blockchain (Phase 4) ----------
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:false}               # off unless infra/.env turns it on
    rpc-url: ${BLOCKCHAIN_RPC_URL:}                    # secret: Alchemy URL contains an API key
    chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}          # Sepolia
    contract-address: ${CREDENTIAL_REGISTRY_ADDRESS:0x1EA82E244e3b38Fc294075Ab03D30F5e3E2947b0}
    deployment-block: ${CREDENTIAL_REGISTRY_DEPLOY_BLOCK:11846277}
    admin-private-key: ${BLOCKCHAIN_ADMIN_PRIVATE_KEY:} # secret: platform admin wallet
    wallet-encryption-key: ${WALLET_ENCRYPTION_KEY:}   # secret: AES-256 master key for institution wallets
    confirmations: 2                                   # blocks to wait before trusting a tx
    receipt-timeout: 3m
    receipt-poll-interval: 4s
    max-fee-per-gas-gwei: 50                           # refuse to send if gas is more expensive

  # ---------- Issuer wallet sync worker (Phase 4) ----------
  wallet-sync:
    interval-ms: 15000           # how often the worker looks for wallets to activate/deactivate
    initial-delay-ms: 10000      # wait after startup before the first run
    batch-size: 5                # max wallets handled per run
    funding-amount-eth: 0.003    # sent from the admin wallet to each new institution wallet
    min-balance-eth: 0.001       # fund only if the institution wallet has less than this

  # ---------- Object storage for certificate PDFs (Phase 4.9) ----------
  storage:
    enabled: ${STORAGE_ENABLED:true}                 # false = run without the Docker storage container
    endpoint: ${S3_ENDPOINT:http://localhost:9000}   # RustFS in Docker; empty = real AWS S3
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}                     # secret
    secret-key: ${S3_SECRET_KEY:}                     # secret
    bucket: ${S3_BUCKET:credchain-certificates}       # created automatically on startup
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}   # true for RustFS/MinIO, false for AWS

  # ---------- Certificate PDF worker (Phase 4.9d) ----------
  certificate-pdf:
    interval-ms: 15000           # how often the worker looks for certificates without a PDF
    initial-delay-ms: 20000      # wait after startup before the first run
    batch-size: 10               # max PDFs created per run

  # ---------- Public verification page (QR codes point here) ----------
  verification:
    base-url: ${VERIFICATION_BASE_URL:http://localhost:5173/verify}

  # ---------- Public verification limits per client IP (Phase 5.3) ----------
  public-rate-limit:
    enabled: true
    lookups-per-minute: 30       # checks by hash / QR link
    uploads-per-minute: 10       # PDF uploads
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}   # true only behind our own nginx / load balancer

  # ---------- AI fraud-detection service (Phase 7) ----------
  fraud:
    enabled: ${FRAUD_ENABLED:true}                    # false = photo / scan checks answer "not available"
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8090}   # docker compose service "fraud"
    api-key: ${FRAUD_API_KEY:}                        # secret, shared with the service (infra/.env)
    connect-timeout: 3s
    read-timeout: 60s                                 # OCR of a large photo can take a while
    trust:
      time-zone: ${APP_TIME_ZONE:Asia/Kolkata}         # days and "midnight to 6 a.m." are counted here
      history-days: 90                                  # the model learns "normal" from this many days
      cron: ${FRAUD_TRUST_CRON:0 30 2 * * *}            # daily trust analysis at 02:30

  # ---------- Notifications and email (Phase 8.2) ----------
  mail:
    enabled: ${MAIL_ENABLED:true}                     # false = emails are only written to the log
    from: ${MAIL_FROM:CredChain <no-reply@credchain.local>}
    web-base-url: ${WEB_BASE_URL:http://localhost:5173}   # links in emails open this website
