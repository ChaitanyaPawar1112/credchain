# Serves the built website and forwards API calls to the backend container.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Photos and PDFs of certificates are up to 5 MB
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Replace (never append to) what the browser sent, so nobody can fake their address for the rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Built files have a hash in their name, so they can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the React app (/verify, /s/..., /admin, ...)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
