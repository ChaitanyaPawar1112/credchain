# Security headers for every page and file of the website (nginx.conf includes this in each location,
# because an add_header inside a location replaces the ones set outside it).
# Only our own scripts may run; styles and fonts may also come from Google Fonts; images may be data: URLs
# (QR codes, the photo-check heat map); the page may only call its own address (/api/ goes to the backend).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# No other website may show CredChain inside a frame (stops click-jacking)
add_header X-Frame-Options "DENY" always;
# Browsers must not guess file types
add_header X-Content-Type-Options "nosniff" always;
# Other sites only learn our address, never the full link (share links contain a private token)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The website never needs the camera, microphone or location
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
